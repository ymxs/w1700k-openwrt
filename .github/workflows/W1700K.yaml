name: W1700K OpenWrt Builds

on:
  workflow_dispatch:

  # GitHub Actions uses UTC; 14:00 Hong Kong time = 06:00 UTC, daily.
  schedule:
    - cron: '0 6 * * *'
permissions:
  actions: write
  contents: write
jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04-arm
    strategy: {fail-fast: false, matrix: {target: [ubi2, ubi2-oc]}}
    env:
      DK_OPENWRT: /bld/openwrt
      DK_BIN: /bld/openwrt_bin
      DK_USER: /bld/user
      DK_PROFILE: /bld/user/current
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@main

    - id: gh
      uses: actions/cache/restore@main
      with: {path: "ghcache\nstcache", key: 'cache-${{ matrix.target }}.${{ github.run_id }}', restore-keys: 'cache-${{ matrix.target }}.'}
    - id: dl
      uses: actions/cache/restore@main
      with: {path: dlcache, key: 'dlcache.${{ github.run_id }}', restore-keys: dlcache.}

    - name: Seed caches if missing
      run: |
        mkdir -p openwrt_bin ghcache stcache dlcache
        if [ -z "$(ls -A ghcache 2>&-)" ] || [ -z "$(ls -A stcache 2>&-)" ]; then
          I=ghcr.io/w1700k/fastbuild_base:base-bldcache-${{ matrix.target }}
          docker pull $I 2>&- && { docker create --name CA $I >/dev/null; for d in ghcache stcache dlcache; do docker cp CA:/$d/. $d; done; }
        fi

    - name: Initialize environment
      run: |
        curl --fail -Z --create-dirs -Lo user/default/files/etc/apk/repositories.d/distfeeds.list https://w1700k.github.io/builds/distfeeds.list
        curl --fail -Z -Lo user/default/files/etc/vermagic.txt https://w1700k.github.io/builds/vermagic.txt
        [ -f "user/${{ matrix.target }}/config.diff" ] || { echo "::error::config.diff not found for ${{ matrix.target }}"; exit 1; }
        rsync -aI --mkpath user/default/ user/${{ matrix.target }}/ user/current/ 2>&-
        echo 'CONFIG_CCACHE_DIR="/ghcache"' >> user/current/config.diff
        sudo tee /etc/docker/daemon.json <<< '{"max-concurrent-downloads":50,"max-concurrent-uploads":50,"experimental":true}'
        sudo systemctl reload docker
        IMAGE=ghcr.io/w1700k/fastbuild_base:base-builder
        docker pull $IMAGE
        docker run -dt --name DK -v $PWD/user:$DK_USER -v $PWD/openwrt_bin:$DK_BIN -v $PWD/ghcache:/ghcache -v $PWD/stcache:/stcache -v $PWD/dlcache:/dlcache $IMAGE
        install -m 755 /dev/stdin /usr/local/bin/docker_exec <<'DKR'
        #!/bin/bash
        for n in DK_BIN DK_USER DK_PROFILE DK_OPENWRT; do e+=(-e "$n=${!n}"); done
        exec docker exec -u 0 -i "${e[@]}" "$@"
        DKR

    - name: Prepare OpenWrt source
      run: |
        docker_exec DK bash -e -c '
          . $DK_PROFILE/settings.ini
          [[ $REPO_URL && $REPO_BRANCH ]] || { echo "::error::Missing REPO_URL or REPO_BRANCH"; exit 1; }
          mkdir -p $DK_OPENWRT/files
          cd $DK_OPENWRT
          if [ ! -d .git ]; then git init; fi
          git remote set-url origin $REPO_URL 2>&- || git remote add origin $REPO_URL
          git fetch && git checkout -f $REPO_BRANCH
          git reset --hard origin/$REPO_BRANCH
          mountpoint $DK_BIN || { echo "::error::not mounted" >&2; exit 1; }
          ln -sf $DK_BIN bin && ln -sf /dlcache dl && ln -sf /stcache staging_dir
          bp=$DK_PROFILE fc=feeds.conf
          # The base-builder image ships a pre-seeded tree whose untracked
          # feeds.conf is never removed by git reset --hard (the upstream repo
          # only tracks feeds.conf.default). Install ours deterministically so
          # that stale file can never be parsed: prefer the profile copy, fall
          # back to the repo file mounted at $DK_USER/default (always present),
          # remove any pre-existing tree feeds.conf, verify byte-for-byte with
          # cmp, and print the active file before running scripts/feeds update.
          echo "--- profile dir ($bp) ---"
          ls -la $bp 2>&1 | head -n 40 || true
          src=""
          if [ -f "$bp/$fc" ]; then
            src="$bp/$fc"
          elif [ -f "$DK_USER/default/$fc" ]; then
            echo "::warning::profile feeds.conf missing at $bp/$fc; using repo default $DK_USER/default/$fc"
            src="$DK_USER/default/$fc"
          else
            echo "::error::feeds.conf not found in profile ($bp) or repo default ($DK_USER/default)"
            exit 1
          fi
          rm -f $fc /tmp/feeds.bak
          cp "$src" $fc || { echo "::error::failed to install feeds.conf from $src"; exit 1; }
          cmp -s "$src" $fc || { echo "::error::installed feeds.conf differs from source $src"; exit 1; }
          # fanboy scripts/feeds strips comments with a regex that needs at least
          # one character after the hash, unlike upstream which uses .* . A lone
          # hash-only line is therefore not stripped and would be mis-parsed as a
          # feed entry, aborting the build. Normalize any stray bare-hash lines to
          # blank before running scripts/feeds update/install.
          sed -i "s/^[[:space:]]*#[[:space:]]*$//" $fc
          cp $fc /tmp/feeds.bak
          echo "--- active feeds.conf (source: $src) ---"
          cat -n $fc
          rm -rf feeds/* &>/dev/null
          # Clone feeds with retries: large anonymous GitHub clones can fail
          # transiently (network hiccup / throttling), and a partial clone would
          # poison later attempts, so wipe feeds/ between tries. Output is kept
          # in /tmp logs so failures are diagnosable instead of swallowed.
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            ./scripts/feeds update -a > /tmp/feeds-update.log 2>&1 && break
            echo "::warning::feeds update failed (attempt $attempt of 3); last log lines:"
            tail -n 60 /tmp/feeds-update.log ||:
            if [ "$attempt" -ge 3 ]; then
              echo "::error::feeds update failed"; exit 1
            fi
            rm -rf feeds/* &>/dev/null
          done
          ./scripts/feeds install -a > /tmp/feeds-install.log 2>&1 || { echo "::error::feeds install failed"; tail -n 60 /tmp/feeds-install.log; exit 1; }
          mv /tmp/feeds.bak $fc &>/dev/null ||:
          cp $bp/config.diff .config
          cp -r $bp/files/ .
          rm -f files/build_info  # clear build_info pre-seeded in the base-builder image
          bash $DK_PROFILE/custom.sh
          make defconfig; echo "CONFIG_VERSION_NUMBER=${{ matrix.target }}" >> .config
          make download -j8 || exit 1
        '

    - name: Compile OpenWrt
      run: |
        docker_exec DK bash -e -c '
          cd $DK_OPENWRT
          export FORCE_UNSAFE_CONFIGURE=1 CCACHE_MAXSIZE=15G CCACHE_SLOPPINESS=file_stat_matches,include_file_mtime,time_macros CCACHE_NOHASHDIR=true CCACHE_COMPILERCHECK=content
          make -j$(($(nproc) + 1)) || make -j1 V=s
          staging_dir/host/bin/ccache -d /ghcache -sz ||:
        '

    - name: Stage firmware
      run: |
        sudo chown -R "$(id -u):$(id -g)" openwrt_bin stcache
        find -L openwrt_bin/targets/*/* -maxdepth 1 \( -name '*sysupgrade.itb' -o -name 'profiles.json' \) -exec install -D -t firmware {} +
        PREFIX="W1700K-OpenWrt_"
        [ "${{ matrix.target }}" = "ubi2-oc" ] && PREFIX="W1700K-OpenWrt-OC_"
        VERSION="${PREFIX}$(TZ=Asia/Hong_Kong date +'%y.%m.%d-%H.%M.%S')_r$(jq -r '.version_code' firmware/profiles.json | sed 's/^r//; s/-.*//')"
        echo "$VERSION" > firmware/version.txt
        RELEASE_NOTES="firmware/release-notes.md"
        if [ "${{ matrix.target }}" = "ubi2" ]; then
          cat > "$RELEASE_NOTES" <<EOF
        ## Quantum Fiber / Gemtek W1700K OpenWrt — ubi2 标准版

        **推荐版本。** 使用标准 CPU 工作参数，优先保障稳定性，适合绝大多数 W1700K 用户日常使用。

        - 机型：Quantum Fiber / Gemtek W1700K
        - 固件分支：\`ubi2\`
        - 构建时间：$(TZ=Asia/Hong_Kong date '+%Y-%m-%d %H:%M:%S %Z')
        - 固件源码：https://github.com/OpenWRT-fanboy/OpenW1700k
        - 已整合 iStoreOS（istoreos-25.12）：iStoreOS feeds、files 包与 Argon 风格界面；Aurora 主题仍可用
        - 本 Release 仅包含 \`sysupgrade.itb\` 升级镜像。

        请确认设备为 W1700K，并在刷写前备份当前配置。
        EOF
        else
          cat > "$RELEASE_NOTES" <<EOF
        ## Quantum Fiber / Gemtek W1700K OpenWrt — ubi2-oc 超频版

        **超频版本：默认性能模式并超频 +200 MHz。**

        - 机型：Quantum Fiber / Gemtek W1700K
        - 固件分支：\`ubi2-oc\`
        - 构建时间：$(TZ=Asia/Hong_Kong date '+%Y-%m-%d %H:%M:%S %Z')
        - 固件源码：https://github.com/OpenWRT-fanboy/OpenW1700k
        - 已整合 iStoreOS（istoreos-25.12）：iStoreOS feeds、files 包与 Argon 风格界面；Aurora 主题仍可用
        - 本 Release 仅包含 \`sysupgrade.itb\` 升级镜像。

        刷写前请确认设备为 W1700K，并备份当前配置。
        EOF
        fi

    - name: Create release
      run: |
        VERSION="$(cat firmware/version.txt)"
        # Release list orders by tag name (desc); the standard tag sorts above
        # the OC tag, so ordering is guaranteed without any cross-job waiting.
        gh release create "$VERSION" firmware/*sysupgrade.itb --title "$VERSION" --notes-file firmware/release-notes.md
        # Remove older releases for this target, but never the one just created.
        if [ "${{ matrix.target }}" = "ubi2-oc" ]; then
          gh release list --json tagName --jq '.[].tagName' | grep -E "^(W1700K-OpenWrt-OC_|W1700K-ubi2-oc_)" | grep -vxF "$VERSION" | xargs -r -n1 gh release delete --cleanup-tag -y ||:
        else
          gh release list --json tagName --jq '.[].tagName' | grep -E "^(W1700K-OpenWrt_|W1700K-ubi2_)" | grep -vxF "$VERSION" | xargs -r -n1 gh release delete --cleanup-tag -y ||:
        fi

    - name: Delete old caches
      if: success()
      run: |
        if [ "${{ matrix.target }}" = "ubi2" ]; then
          for p in dlcache. cache-${{ matrix.target }}.; do
            gh cache list --json key,id --jq '.[] | select(.key | startswith("'"$p"'")) | .id' | xargs -r -n1 gh cache delete
          done
        else
          gh cache list --json key,id --jq '.[] | select(.key | startswith("cache-${{ matrix.target }}.")) | .id' | xargs -r -n1 gh cache delete
        fi ||:

    - uses: actions/cache/save@main
      if: success()
      with: {path: "ghcache\nstcache", key: '${{ steps.gh.outputs.cache-primary-key }}'}
    - if: ${{ matrix.target == 'ubi2' && success() }}
      uses: actions/cache/save@main
      with: {path: dlcache, key: '${{ steps.dl.outputs.cache-primary-key }}'}
