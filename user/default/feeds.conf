# ============================================================
# iStoreOS feed configuration (istoreos-25.12 generation)
#
# This file replaces the base repo's feeds.conf.default during CI
# (the workflow copies it over before `scripts/feeds update/install`).
# The jjm2473 forks are full mirrors of upstream openwrt/packages and
# openwrt/luci plus iStoreOS additions, so all standard OpenWrt
# packages remain available alongside the iStoreOS ecosystem.
#
# Note: the app-store feed (linkease/istore) is intentionally NOT
# listed here - custom.sh vendors those 4 packages directly into
# package/, which would conflict with a same-named feed entry.
# ============================================================

src-git packages https://github.com/jjm2473/packages.git;istoreos-25.12
src-git luci https://github.com/jjm2473/luci.git;istoreos-25.12
src-git routing https://github.com/openwrt/routing.git;openwrt-25.12

# iStoreOS third-party packages: luci-theme-argon + luci-app-argon-config
# (fetched as git submodules by `scripts/feeds update`), plus NAS-oriented
# apps (cifs/nfs mount, filetransfer, vlmcsd, webdavfs, ...)
src-git third https://github.com/jjm2473/openwrt-third.git;main
